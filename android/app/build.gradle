plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'

}

android {
    namespace "com.talkyplay.zapai"
    compileSdk 35
    ndkVersion = "26.1.10909125"

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            storeFile file("D:/chatterboxaI-/zapai.jks")
            storePassword "zapai1"
            keyAlias "key0"
            keyPassword "zapai1"
        }
        customDebug {
            storeFile file("D:/chatterboxaI-/zapai.jks")
            storePassword "zapai1"
            keyAlias "key0"
            keyPassword "zapai1"
        }
    }
    defaultConfig {
        applicationId "com.talkyplay.zapai"
        minSdk 23
        targetSdkVersion 34
        multiDexEnabled true
        versionCode 11
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.customDebug // 👈 use your custom one
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
