    sdk: flutter

  flutter_lints: ^5.0.0

dependencies_overrides:
  speech_to_text: ^7.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#462F8B"
  adaptive_icon_foreground: "assets/icon/logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottiefile/
    - assets/fonts/
    - assets/svg/

  fonts:
    - family: roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Light.ttf
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
        - asset: assets/fonts/roboto/Roboto-Bold.ttf

    - family: inter
      fonts:
        - asset: assets/fonts/inter/Inter_24pt-Light.ttf
        - asset: assets/fonts/inter/Inter_24pt-Medium.ttf
        - asset: assets/fonts/inter/Inter_28pt-Bold.ttf
